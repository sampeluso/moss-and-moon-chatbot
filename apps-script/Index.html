<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f3eb;
      color: #24382e;
      font: 1rem/1.55 system-ui, sans-serif;
    }
    header {
      padding: 1rem clamp(1rem, 5vw, 4rem);
      background: #17392d;
      color: #fff;
      font-weight: 700;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(2rem, 5vw, 5rem);
      max-width: 74rem;
      margin: auto;
      padding: clamp(2rem, 6vw, 5rem) clamp(1rem, 5vw, 4rem);
    }
    h1, h2 { font-family: Georgia, serif; line-height: 1.08; }
    h1 { margin: 0; font-size: clamp(2.75rem, 6vw, 5rem); }
    h2 { margin: 0; font-size: 1.55rem; }
    .intro { max-width: 32rem; margin: 1.25rem 0 2rem; }
    .topics { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .85rem; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #a45d32;
      outline-offset: 3px;
    }
    .topic {
      padding: .55rem .85rem;
      border: 1px solid #84988b;
      border-radius: 2rem;
      background: transparent;
      color: inherit;
    }
    .topic:hover:not(:disabled) { background: #e1e9dd; }
    .chat {
      align-self: start;
      overflow: hidden;
      border: 1px solid #becabf;
      border-radius: 1rem;
      background: #fff;
    }
    .chat-heading { padding: 1.2rem; background: #dae8d8; }
    .messages {
      display: flex;
      flex-direction: column;
      gap: .75rem;
      height: 19rem;
      overflow-y: auto;
      padding: 1.2rem;
    }
    .message {
      align-self: flex-start;
      max-width: 90%;
      margin: 0;
      padding: .65rem .9rem;
      border-radius: .85rem;
      background: #edf2ec;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .visitor { align-self: flex-end; background: #24543c; color: #fff; }
    .status { min-height: 1.5rem; margin: 0 1.2rem .25rem; color: #52685a; }
    form { padding: .75rem 1.2rem 1.2rem; border-top: 1px solid #dae3da; }
    label { display: block; margin-bottom: .4rem; font-weight: 600; }
    .compose { display: flex; gap: .5rem; }
    input {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: .65rem;
      border: 1px solid #84988b;
      border-radius: .5rem;
      color: inherit;
    }
    .send {
      padding: .65rem 1rem;
      border: 0;
      border-radius: .5rem;
      background: #24543c;
      color: #fff;
    }
    @media (max-width: 48rem) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>Moss &amp; Moon Terrarium Hospital</header>
  <main>
    <section aria-labelledby="welcome">
      <h1 id="welcome">A little care for your little world.</h1>
      <p class="intro">From foggy glass to holiday boarding, ask us about care for your terrarium.</p>
      <h2>Popular questions</h2>
      <div class="topics">
        <button class="topic" type="button" data-question="How much is a terrarium checkup?">Checkup prices</button>
        <button class="topic" type="button" data-question="Do you treat mould?">Mould treatment</button>
        <button class="topic" type="button" data-question="Can you look after my terrarium while I’m on holiday?">Holiday boarding</button>
        <button class="topic" type="button" data-question="Do you offer home visits?">Home visits</button>
      </div>
    </section>

    <section class="chat" aria-labelledby="chat-title">
      <div class="chat-heading"><h2 id="chat-title">Ask the hospital</h2></div>
      <div id="messages" class="messages" role="log" aria-label="Conversation"
           tabindex="0">
        <p class="message">Hi! Pick a popular question or type your own below.</p>
      </div>
      <p id="status" class="status" role="status"></p>
      <form id="chat-form">
        <label for="question">Your question</label>
        <div class="compose">
          <input id="question" required maxlength="400">
          <button class="send" type="submit">Send</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('question');
    const messages = document.getElementById('messages');
    const status = document.getElementById('status');
    const buttons = document.querySelectorAll('button');
    let waiting = false;

    function addMessage(text, fromVisitor) {
      const message = document.createElement('p');
      message.className = fromVisitor ? 'message visitor' : 'message';
      message.textContent = text;
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
    }

    function finish(reply) {
      status.textContent = '';
      addMessage(reply, false);
      waiting = false;
      buttons.forEach((button) => { button.disabled = false; });
    }

    function ask(text) {
      if (!text || waiting) return;
      waiting = true;
      buttons.forEach((button) => { button.disabled = true; });
      addMessage(text, true);
      status.textContent = 'Checking the FAQ…';

      google.script.run
        .withSuccessHandler(finish)
        .withFailureHandler(() => finish('Something went wrong. Please try again.'))
        .ask(text);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || waiting) return;
      input.value = '';
      ask(text);
      input.focus();
    });

    document.querySelectorAll('.topic').forEach((button) => {
      button.addEventListener('click', () => {
        ask(button.dataset.question);
        input.focus();
      });
    });
  </script>
</body>
</html>
